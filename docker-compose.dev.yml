# Development stack. There is no host-side alternative to this file — see the
# `dev` stage in the Dockerfile, bin/_in-container.sh, and loop/run's own
# refusal.
#
# Difference from docker-compose.yml: the source tree is bind-mounted so the
# watchers see host edits. The production invariant that `/workspace` is the
# only shared surface (design doc §6) still holds for the *agent* — it is
# handed /workspace, not /app — but a dev container does hold the repo. Do
# not model production blast radius on this file.
#
# The workspace lives outside the repo, so /app does not contain it and a
# project has exactly one container path. While it was ./workspace, this file
# mounted it twice — as /workspace and, inside the repo bind, as
# /app/workspace — and only the first name passes the containment check in
# packages/server/src/workspace.ts.
name: overseer-dev

# Every service builds from the same Dockerfile and must run as the same user:
# the node_modules volumes are seeded from whichever builds first, and a uid
# mismatch between them makes the bind-mounted workspace unwritable. ./bin/*
# fills these from `id -u` / `id -g`; a bare `docker compose` gets 1000.
x-build: &app-build
  context: .
  target: dev
  args:
    OVERSEER_UID: ${OVERSEER_UID:-1000}
    OVERSEER_GID: ${OVERSEER_GID:-1000}

services:
  # The Docker daemon the *workspace projects* build and test against —
  # `loop/steps/verify.md` runs each project's own commands, and several of
  # those are `docker compose` (a project's own bin/test). A sidecar
  # rather than a bind of /var/run/docker.sock: the host socket is
  # root-equivalent, and handing it to a container that runs an agent with
  # unprefixed Bash would undo the sandbox this stack exists to be.
  #
  # /workspace and /app/loop are mounted at the *same paths* the app container
  # sees. A project's compose file says `volumes: [.:/app]`; compose resolves
  # `.` client-side, in the app container, and hands the daemon an absolute
  # path it then resolves in its own namespace. Without path parity every
  # project bind mount silently mounts an empty directory. /app/loop is in
  # there because a `review` QA run happens in a worktree under loop/db/.
  dind:
    image: docker:28-dind
    privileged: true
    environment:
      # Plain tcp, which is only acceptable because 2375 is never published and
      # is reachable on this compose network alone.
      - DOCKER_TLS_CERTDIR=
    volumes:
      # Named, not a bind: overlayfs will not run on a bind mount.
      - dind-storage:/var/lib/docker
      - ${OVERSEER_WORKSPACE_HOST:-../overseer-workspace}:/workspace
      - ./loop:/app/loop

  # Builds protocol + adapters once, then holds them in tsc --watch. server and
  # web both resolve @overseer/* through `main: ./dist/index.js`, so neither can
  # start until this has produced dist/ at least once — hence the healthcheck
  # gate rather than a plain depends_on.
  deps:
    build: *app-build
    command: bash /app/bin/deps-watch.sh
    volumes:
      - .:/app
      - node-modules-root:/app/node_modules
      - node-modules-protocol:/app/packages/protocol/node_modules
      - node-modules-web:/app/packages/web/node_modules
      - node-modules-server:/app/packages/server/node_modules
      - node-modules-claude-code:/app/packages/adapters/claude-code/node_modules
      - node-modules-cursor:/app/packages/adapters/cursor/node_modules
    environment:
      # Bind mounts on Docker Desktop do not deliver inotify reliably; polling
      # is the cost of hot reload here. Set to 0 in the shell if you'd rather
      # restart by hand on a hot laptop.
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-1}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /app/packages/protocol/dist/index.js && test -f /app/packages/adapters/claude-code/dist/index.js && test -f /app/packages/adapters/cursor/dist/index.js",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Also the container the dev loop runs in — ./bin/loop execs loop/run here,
  # so both front-ends see one workspace, one provider registry, and one set of
  # signed-in CLIs.
  server:
    build: *app-build
    command: npm run dev --workspace packages/server
    # Reap orphans. This service spawns PTY children (the raw console, a loop
    # run) whose own children outlive them; PID 1 here is `npm`, which never
    # calls wait(), so every killed console left a <defunct> claude behind.
    init: true
    ports:
      # Loopback only — this is RCE-as-a-service (design doc §6).
      # Host :3001 so the dev API can run alongside production on :3000.
      # Container-internal stays 3000 (Vite proxies to http://server:3000).
      - "127.0.0.1:3001:3000"
    environment:
      - HOST=0.0.0.0 # container-internal; the port mapping above is the real boundary
      - PORT=3000
      # Where code, state and the workspace live is stated by the image
      # (CLAUDE_CONFIG_DIR, OVERSEER_WORKSPACE, OVERSEER_PROVIDERS_DIR,
      # OVERSEER_INTERNAL_DIR). Repeating a path here is how the two drift.
      #
      # This one is a fact about *this file's* topology, not the image's:
      - DOCKER_HOST=tcp://dind:2375
      # From project .env (see .env.example). Unset → UTC.
      - TZ=${TZ:-UTC}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-1}
      # Optional, from .env: authorship on the commits loop/bin/land writes.
      # Pushing is authenticated by the ssh key the operator generates in
      # settings, not by a token.
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-}
    volumes:
      - .:/app
      # Every provider CLI's config and auth, for the app and the loop alike.
      # Container-owned; never bound to the host (design doc §6 — the argument
      # against mounting the operator's own ~/.claude). Nothing from the image
      # lives under this path, because a volume shadows what it mounts over.
      - agent-home:/home/overseer
      # Internal memory (docs/overseer.md §6.2). This one matters more in dev
      # than in prod: /app is a bind mount of the repo here, so without this
      # named volume shadowing it the overseer's private store would be written
      # straight into the host working tree — exactly the thing it must not be.
      - overseer-memory:/app/.overseer
      - ${OVERSEER_WORKSPACE_HOST:-../overseer-workspace}:/workspace # the only surface the agent gets
      - node-modules-root:/app/node_modules
      - node-modules-protocol:/app/packages/protocol/node_modules
      - node-modules-web:/app/packages/web/node_modules
      - node-modules-server:/app/packages/server/node_modules
      - node-modules-claude-code:/app/packages/adapters/claude-code/node_modules
      - node-modules-cursor:/app/packages/adapters/cursor/node_modules
      # Anonymous volume shadows any stale build a host `npm run build` left in
      # web/dist. The server refuses to serve it in dev anyway (NODE_ENV
      # guard), but this means the directory doesn't even exist to trip over.
      - /app/packages/web/dist
    depends_on:
      deps:
        condition: service_healthy
      dind:
        condition: service_started

  web:
    build: *app-build
    command: npm run dev --workspace packages/web
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - OVERSEER_SERVER_ORIGIN=http://server:3000
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-1}
    volumes:
      - .:/app
      - node-modules-root:/app/node_modules
      - node-modules-protocol:/app/packages/protocol/node_modules
      - node-modules-web:/app/packages/web/node_modules
      - node-modules-server:/app/packages/server/node_modules
      - node-modules-claude-code:/app/packages/adapters/claude-code/node_modules
      - node-modules-cursor:/app/packages/adapters/cursor/node_modules
    depends_on:
      deps:
        condition: service_healthy

  # Playwright acceptance tests against the running web + server services —
  # never against the host (see bin/test-e2e; there is no host-side run path
  # for this project, tests included). `docker compose run` starts its
  # depends_on services if they aren't already up, so `./bin/test-e2e` alone
  # is enough to stand up the stack and run against it.
  e2e:
    build:
      context: .
      target: test
      args:
        OVERSEER_UID: ${OVERSEER_UID:-1000}
        OVERSEER_GID: ${OVERSEER_GID:-1000}
    environment:
      - E2E_BASE_URL=http://web:5173
      - CI=${CI:-}
    volumes:
      - .:/app
      - node-modules-root:/app/node_modules
      - node-modules-protocol:/app/packages/protocol/node_modules
      - node-modules-web:/app/packages/web/node_modules
      - node-modules-server:/app/packages/server/node_modules
      - node-modules-claude-code:/app/packages/adapters/claude-code/node_modules
      - node-modules-cursor:/app/packages/adapters/cursor/node_modules
      - node-modules-e2e:/app/packages/e2e/node_modules
      # Reports and traces land on the host so a failure can be inspected
      # after the container exits.
      - ./packages/e2e/playwright-report:/app/packages/e2e/playwright-report
      - ./packages/e2e/test-results:/app/packages/e2e/test-results
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started

volumes:
  # Every provider's config and auth — Claude's subscription token, Cursor's,
  # and whatever the next CLI writes. One volume rather than one per provider:
  # adding a provider should not mean editing two compose files. The dev
  # project name (overseer-dev) keeps this separate from production's.
  agent-home:
  # Internal memory: logs, the action register, the world snapshot. Named
  # volume, never a bind mount — see the server service's note above.
  overseer-memory:
  # The workspace projects' own images and layers, built by the dind sidecar.
  # Discarded by ./bin/reset; the next run rebuilds them.
  dind-storage:
  # These shadow the bind-mounted host node_modules, which is macOS-built and
  # would break native deps in a linux container.
  node-modules-root:
  node-modules-protocol:
  node-modules-web:
  node-modules-server:
  node-modules-claude-code:
  node-modules-cursor:
  node-modules-e2e:
