# Production stack. The compiled SPA is served by the Node server; the repo is
# not here — only what the runtime stage COPYed, plus /workspace.
name: overseer

services:
  # Optional — started only when OVERSEER_DOCKER=1 (.env.example), which is what
  # the `docker` profile on the next two services means. Without it there is no
  # daemon and `docker` in a console says so.
  #
  # The Docker daemon the *workspace projects* build and test against. See the
  # long note in docker-compose.dev.yml: a sidecar rather than a bind of the
  # host's /var/run/docker.sock, and /workspace and /app/loop/db mounted at the
  # same paths the app container sees so project bind mounts resolve.
  dind:
    profiles: ["docker"]
    image: docker:28-dind
    privileged: true
    # Matches overseer's policy: when the Docker daemon brings overseer back
    # after a reboot it ignores depends_on, so this has to come back on its own.
    restart: unless-stopped
    # A unix socket and nothing else. The image's default also listens on tcp,
    # which every console could reach; this socket lives in a volume only
    # `docker-filter` mounts, so the filter is the one way in
    # (spec/architecture.md §6.3). Naming the command is what turns the tcp
    # listener off — the entrypoint adds it only when given no command.
    command: ["dockerd", "--host=unix:///run/dind/docker.sock"]
    volumes:
      # Named, not a bind: overlayfs will not run on a bind mount.
      - dind-storage:/var/lib/docker
      - dind-socket:/run/dind
      - ${OVERSEER_WORKSPACE_HOST:-../overseer-workspace}:/workspace
      - loop-db:/app/loop/db

  # What consoles talk to instead of the daemon: it passes ordinary compose
  # work on and refuses what would hand a container the sidecar itself
  # (packages/docker-filter). Its own image and never the app's — nothing an
  # agent can write to is in it.
  docker-filter:
    profiles: ["docker"]
    build:
      context: .
      target: docker-filter
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    # To follow a bind source through directories its user cannot enter.
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    environment:
      - DOCKER_FILTER_BIND_ROOTS=/workspace:/app/loop/db
    volumes:
      - dind-socket:/run/dind
      # The sidecar's shared directories at the sidecar's paths, read-only, so
      # a link followed here leads where it will lead there.
      - ${OVERSEER_WORKSPACE_HOST:-../overseer-workspace}:/workspace:ro
      - loop-db:/app/loop/db:ro
    depends_on:
      dind:
        condition: service_started

  overseer:
    build:
      context: .
      # Explicit production target.
      target: runtime
      args:
        OVERSEER_UID: ${OVERSEER_UID:-1000}
        OVERSEER_GID: ${OVERSEER_GID:-1000}
    # Reap orphans — PTY children (raw console, loop runs) leave <defunct>
    # entries behind otherwise, since the node entrypoint never calls wait().
    init: true
    # Every console is a PTY child of this process (spec/architecture.md §1.2),
    # so a crashed server takes them with it; coming back is the most this can
    # do. Unhandled rejections already crash Node, which lands here.
    restart: unless-stopped
    # Compose does not restart an unhealthy container — this only makes a
    # wedged server show as `unhealthy` in `docker compose ps` instead of
    # `running`. Loopback inside the container, whatever HOST binds.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000" # loopback only — this is RCE-as-a-service (spec/architecture.md §6)
    volumes:
      # Every provider CLI's config and auth, for the app and the loop alike.
      # Container-owned; never bound to the host. Nothing from the image lives
      # under this path, because a volume shadows what it mounts over.
      - agent-home:/home/overseer
      - overseer-memory:/app/.overseer # the overseer's internal memory (spec/behaviour/overseer.md §6.2)
      - loop-db:/app/loop/db # the dev loop's file store
      - ${OVERSEER_WORKSPACE_HOST:-../overseer-workspace}:/workspace # the only shared surface
    environment:
      # Where code, state and the workspace live is stated by the image
      # (CLAUDE_CONFIG_DIR, OVERSEER_WORKSPACE, OVERSEER_PROVIDERS_DIR,
      # OVERSEER_INTERNAL_DIR). Repeating a path here is how the two drift.
      #
      # This one is a fact about *this file's* topology, not the image's.
      # bin/_lib.sh sets it to the filter when OVERSEER_DOCKER=1; otherwise the
      # address is the message, because the Docker CLI prints it back:
      # "Cannot connect to the Docker daemon at unix:///docker-is-off/…".
      - DOCKER_HOST=${OVERSEER_DOCKER_HOST:-unix:///docker-is-off/set-OVERSEER_DOCKER-in-.env}
      # From project .env (see .env.example). Unset → UTC.
      - TZ=${TZ:-UTC}
      # Optional, from .env: authorship on the commits loop/bin/land writes.
      # Pushing is authenticated by the ssh key the operator generates in
      # settings, not by a token.
      #
      # Bare names, not `${VAR:-}`. The default form passed these through as
      # *empty strings* on a host that set none, and git reads these four ahead
      # of every config file — so an empty one beat the identity the operator
      # saved in settings, and `git commit` failed with "empty ident name"
      # instead. The bare form leaves an unset variable unset in the container,
      # which is the whole difference between poisoning the identity and
      # staying out of its way.
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
    depends_on:
      # Only when the profile is on; ignored otherwise.
      docker-filter:
        condition: service_started
        required: false

volumes:
  # Every provider's config and auth — Claude's subscription token, Cursor's,
  # and whatever the next CLI writes. One volume rather than one per provider:
  # adding a provider should not mean editing two compose files. A named volume
  # and never a bind mount — the argument in spec/architecture.md §6
  # against mounting the operator's own ~/.claude. Discarded by ./bin/reset.
  agent-home:
  # Internal memory: logs, the action register, the world snapshot. A named
  # volume and never a bind mount — the precedence rule in spec/behaviour/overseer.md §6.1
  # only holds because nothing here is reachable from the host or from
  # /workspace.
  overseer-memory:
  # The dev loop's file store — request records, plans, verify records, the
  # append-only index, and each workspace's accumulated memory. In dev this is
  # the repo's own loop/db/ through the bind mount; here it has nowhere else to
  # live, and none of it is regenerable.
  loop-db:
  # The workspace projects' own images and layers, built by the dind sidecar.
  dind-storage:
  # The sidecar daemon's socket, shared with docker-filter and nothing else.
  dind-socket:
